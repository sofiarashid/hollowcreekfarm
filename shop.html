<!doctype html>
<html lang="en">

<head>
    <title>Hollow Creek Farm | Shop</title>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS v5.3.8 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&display=swap" rel="stylesheet">

    <!-- Main CSS first so the navbar uses your normal site styling -->
    <link rel="stylesheet" href="css files/styles.css">

    <!-- Shop CSS second so the shop page layout still works -->
    <link rel="stylesheet" href="css files/shop.css">
</head>

<body class="shopbody">

    <header>
        <!-- navbar starts -->
        <nav class="navbar navbar-expand-lg navbar-home">
            <div class="container-fluid">

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                    <div class="navbar-nav">

                        <!-- Image credit: Provided Hollow Creek Farm asset folder. Licensed for class use. -->
                        <img src="Client Files/Logo.png" class="navbarimg" alt="Hollow Creek Farm logo">

                        <a class="nav-link" href="index.html">Home</a>
                        <a class="nav-link" href="aboutus.html">About Us</a>
                        <a class="nav-link active" aria-current="page" href="shop.html">Shop</a>
                        <a class="nav-link" href="contactus.html">Contact Us</a>
                        <a class="nav-link" href="seasonal.html">Seasonal</a>
                        <a class="nav-link" href="events.html">Events</a>

                    </div>
                </div>

            </div>
        </nav>
        <!-- navbar ends -->
    </header>

    <main>
        <section class="shop-page">

            <div class="shop-title-box">
                <h1>Shop</h1>
            </div>

            <div class="shop-filter-box">
                <button class="shop-filter-btn active" data-filter="all">Show All</button>
                <button class="shop-filter-btn" data-filter="fresh">Fresh</button>
                <button class="shop-filter-btn" data-filter="fruit">Fruit</button>
                <button class="shop-filter-btn" data-filter="vegan">Vegan</button>
            </div>

            <div id="shopProducts" class="shop-grid"></div>

        </section>
    </main>

    <footer class="shop-footer">
        <p>© 2026 • Sofia • Jon • Web 2</p>
    </footer>

    <!-- Bootstrap JavaScript Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script src="shop.js"></script>

</body>

</html>
