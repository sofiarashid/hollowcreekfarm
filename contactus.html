<!doctype html>
<html lang="en">

<head>
    <title>Hollow Creek Farm</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS v5.3.8 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link rel="stylesheet" href="styles.css" />
    <!-- Navbar Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&display=swap" rel="stylesheet">
</head>

<body class="contactsusbody">
    <header>
        <!--navbar starts-->
        <nav class="navbar navbar-expand-lg navbar-home">
            <div class="container-fluid">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                    <div class="navbar-nav">
                        <img src="Client Files/Logo.png" class="navbarimg">
                        <a class="nav-link" aria-current="page" href="index.html">Home</a>
                        <a class="nav-link" href="aboutus.html">About Us</a>
                        <a class="nav-link" href="shop.html">Shop</a>
                        <a class="nav-link active" href="contactus.html">Contact Us</a>
                        <a class="nav-link" href="seasonal.html">Seasonal</a>
                        <a class="nav-link" href="events.html">Events</a>
                    </div>
                </div>
            </div>
        </nav>
        <!--navbar ends + title-->
    </header>
    <main>
        <div class="contactinfobox">Contact Information</div>
        <div class="row justify-content-start">
            <div class="col-sm-1 col-md-1 col-lg-9">
                <img class="img-fluid w-100 rounded-4" src="Client Files/Call-to-Action Banners/cta-visit-farm-store-produce-display.png" alt="Visit the farm store">
            </div>
            <div class="row">

            <div class="col-sm-1 col-md-1 col-lg-3"></div>
                        </div>

        </div>

        <!-- three equal boxes: contact form / details / social -->
        <section class="contact-cards mt-4">
            <div class="row g-3">
                <div class="col-12 col-md-4">
                    <div class="contact-card">
                        <h3>Contact Form</h3>
                        <form class="contact-form" action="#" method="post">
                            <input type="text" class="form-control" name="name" placeholder="Your name" required>
                            <input type="email" class="form-control" name="email" placeholder="Your email" required>
                            <textarea class="form-control" name="message" rows="4" placeholder="Message"></textarea>
                            <button class="btn btn-primary mt-2 align-self-center" type="submit">Send</button>
                        </form>
                    </div>
                </div>
                <div class="col-12 col-md-4">
                    <div class="contact-card">
                        <h3>Contact Details</h3>
                        <div class="details row text-center mt-2">
                            <div class="col-4">
                                <strong>Email</strong>
                                <p class="mb-0">hello@hollowcreekfarm.com</p>
                            </div>
                            <div class="col-4">
                                <strong>Phone</strong>
                                <p class="mb-0">(555) 123-4567</p>
                            </div>
                            <div class="col-4">
                                <strong>Address</strong>
                                <p class="mb-0">123 Farm Lane</p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-md-4">
                    <div class="contact-card">
                        <h3>Follow Us</h3>
                        <div class="social d-flex justify-content-around align-items-center mt-3">
                            <a class="social-link" href="#" aria-label="Facebook">FB</a>
                            <a class="social-link" href="#" aria-label="Instagram">IG</a>
                            <a class="social-link" href="#" aria-label="X">X</a>
                            <a class="social-link" href="#" aria-label="YouTube">YT</a>
                        </div>
                    </div>
                </div>
            </div>
        </section>


    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>

</html>
